  <head>

    <style>
      .page-head {
        background: var(--primary);
        color: var(--on-primary);
        padding-block: 32px;
      }
      .page-head h1 {
        color: #fff;
      }
      .page-head p {
        color: #cfe6d4;
        margin: 8px 0 0;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--primary);
        text-decoration: none;
        font:
          600 14px/1 Inter,
          sans-serif;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--card);
        margin: 0 0 14px;
      }
      .back:hover,
      .back:focus-visible {
        background: var(--day-bg);
        border-color: var(--primary);
      }
      .back svg {
        width: 16px;
        height: 16px;
      }

      .controls {
        position: sticky;
        top: 72px;
        z-index: 30;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        padding-block: 12px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      #q {
        flex: 1 1 260px;
        min-height: 48px;
        padding: 10px 16px;
        font: inherit;
        border: 1px solid var(--line-strong);
        border-radius: var(--r);
        background: var(--card);
      }
      #q:focus {
        border-color: var(--accent);
      }
      .modes {
        display: flex;
        border: 1px solid var(--line-strong);
        border-radius: var(--r);
        overflow: hidden;
        background: var(--card);
        flex: 1 1 240px;
      }
      .modes button {
        flex: 1;
        min-height: 48px;
        padding: 0 18px;
        border: 0;
        background: transparent;
        font:
          600 15px/1 Inter,
          sans-serif;
        color: var(--muted);
        cursor: pointer;
      }
      .modes button[aria-pressed="true"] {
        background: var(--primary);
        color: #fff;
      }
      /* Chip strip: fades at the right edge while more chips remain, so it reads as
     swipeable. .chips-wrap owns the fade; .chips owns the scrolling. */
      .chips-wrap {
        position: relative;
        margin-top: 14px;
      }
      .chips-wrap::after {
        content: "\203A"; /* chevron, sits on top of the fade */
        position: absolute;
        right: 0;
        top: 0;
        bottom: 12px;
        width: 60px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 10px;
        font:
          400 22px/1 Inter,
          sans-serif;
        color: var(--primary);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        background: linear-gradient(90deg, transparent, var(--card) 60%);
      }
      .chips-wrap[data-more="true"]::after {
        opacity: 1;
      }
      .chips-wrap[data-more="true"] .chips {
        padding-right: 44px;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0 12px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: var(--accent) #dfe8dc;
      }
      .chips::-webkit-scrollbar {
        height: 8px;
      }
      .chips::-webkit-scrollbar-track {
        background: #e7eee5;
        border-radius: 999px;
      }
      .chips::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 999px;
      }
      .chips::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      /* Desktop has the width for all 15 chips, so wrap them instead of making a
     mouse user drag a horizontal scroller. No scrollbar, no fade, no chevron. */
      @media (min-width: 900px) {
        .chips {
          flex-wrap: wrap;
          overflow: visible;
          padding-bottom: 2px;
          row-gap: 10px;
        }
        .chips-wrap::after {
          display: none;
        }
        .chips-wrap[data-more="true"] .chips {
          padding-right: 0;
        }
      }
      .chips button {
        white-space: nowrap;
        min-height: 44px;
        padding: 0 16px;
        cursor: pointer;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--card);
        font: inherit;
        font-size: 14px;
        color: var(--ink);
      }
      .chips button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
        margin: 10px 0 0;
      }

      main {
        padding-bottom: 120px;
      }
      .cat {
        font-family: Lora, serif;
        font-size: 24px;
        color: var(--primary);
        margin: 36px 0 12px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--accent);
      }
      @media (min-width: 900px) {
        .cat {
          font-size: 32px;
        }
      }

      .item {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 14px;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px 14px;
        margin-bottom: 8px;

      .name {

      .unit {

        font-size: 13px;
      }
      .item.out .unit {

      .price {

        font:

        color: var(--season-ink);

      .add {

        background: var(--card);

        line-height: 1;
      }
      .add:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .qty {
        display: flex;

      .qty button {
        min-width: 40px;
        min-height: 40px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);

      .qty span {
        min-width: 30px;
        text-align: center;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .empty {

      }

      .terms {
        margin: 36px 0;

      .orderbar {

        }
        .terms {

          border: 1px solid #ccc;

        .add,

    </style>

    <script>
      // ---- config -----------------------------------------------------------
      const SHEET_CSV_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQECqpmyg2-DW5bi1GZ0IyoZbU-ErwCF-OmrgqSwrhdfpmrhIyfyV9DoBpnwXciIsiCoMulwlXk3wW/pub?output=csv"; // ← gepubliceerde CSV-URL van het Sheet
      const FALLBACK_CSV_URL = "prijslijst-template.csv";
      const WA_NUMBER = "31683415676";
      // Google caches the published CSV for 5 minutes regardless, so a longer
      // cache here only delays edits without saving a meaningful request.
      const CACHE_MS = 60 * 1000;

      // ---- csv --------------------------------------------------------------
      // Quote-aware: product names contain commas and quotes.
      function parseCSV(text) {
        const rows = [];
        let row = [],
          f = "",
          q = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (q) {
            if (c === '"') {
              if (text[i + 1] === '"') {
                f += '"';
                i++;
              } else q = false;
            } else f += c;
          } else if (c === '"') q = true;
          else if (c === ",") {
            row.push(f);
            f = "";
          } else if (c === "\n") {
            row.push(f);
            rows.push(row);
            row = [];
            f = "";
          } else if (c !== "\r") f += c;
        }
        if (f !== "" || row.length) {
          row.push(f);
          rows.push(row);
        }
        if (!rows.length) return [];
        const head = rows[0].map((h) => h.trim().toLowerCase());
        return rows
          .slice(1)
          .filter((r) => r.length > 1 && r[0] && !r[0].trim().startsWith("#"))
          .map((r) =>
            Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])),
          );
      }

      // ---- money ------------------------------------------------------------
      // Sheet holds ex-BTW only. Consumers must see incl-BTW (wettelijk verplicht).
      // btw blank -> 9, the NL rate for all fresh produce.
      function priceFor(item, mode) {
        const ex = parseFloat(item.prijs_ex);
        if (!isFinite(ex)) return null;
        if (mode === "b2b") return ex;
        const rate = parseFloat(item.btw);
        return (
          Math.round(ex * (1 + (isFinite(rate) ? rate : 9) / 100) * 100) / 100
        );
      }
      const euro = (n) => "€ " + n.toFixed(2).replace(".", ",");
      const isOut = (it) => (it.status || "").toLowerCase() === "uitverkocht";
      const isDay = (it) =>
        (it.status || "").toLowerCase() === "dagprijs" ||
        !isFinite(parseFloat(it.prijs_ex));

      // ---- state ------------------------------------------------------------
      // Mode precedence: ?mode= wins, then localStorage, then Zakelijk.
      function initialMode() {
        const p = new URLSearchParams(location.search).get("mode");
        if (p === "b2b" || p === "b2c") return p;
        const s = localStorage.getItem("sa-mode");
        return s === "b2b" || s === "b2c" ? s : "b2b";
      }
      function initialCats() {
        const p = new URLSearchParams(location.search).get("cat");
        return p
          ? p
              .split(",")
              .map((c) => c.trim())
              .filter(Boolean)
          : [];
      }
      let items = [],
        mode = initialMode(),
        cat = "",
        catSet = initialCats(),
        query = "";
      let basket = JSON.parse(localStorage.getItem("sa-basket") || "{}");
      const key = (it) => it.categorie + "|" + it.product + "|" + it.eenheid;
      const save = () =>
        localStorage.setItem("sa-basket", JSON.stringify(basket));

      // ---- basket -----------------------------------------------------------
      // Returns false when the item may not be added, so uitverkocht is blocked at
      // the source rather than only hidden in the UI.
      function addToBasket(it, delta) {
        if (isOut(it) && delta > 0) return false;
        const k = key(it),
          cur = basket[k]?.n || 0,
          next = Math.max(0, cur + delta);
        if (next === 0) delete basket[k];
        else basket[k] = { n: next, product: it.product, eenheid: it.eenheid };
        save();
        return true;
      }
      function waMessage() {
        const lines = Object.values(basket).filter((b) => b.n > 0);
        if (!lines.length) return "";
        return (
          "Hallo S&A Freshlevering, ik wil graag bestellen:\n\n" +
          lines.map((b) => `- ${b.n}x ${b.product} (${b.eenheid})`).join("\n") +
          "\n\nBezorgadres:\nGewenste bezorgdag:"
        );
      }

      // ---- render -----------------------------------------------------------
      function visible() {
        const q = query.toLowerCase();
        return items.filter((it) => {
          if (mode === "b2c" && String(it.b2c).toUpperCase() !== "TRUE")
            return false;
          if (cat && it.categorie !== cat) return false;
          if (!cat && catSet.length && !catSet.includes(it.categorie))
            return false;
          if (q && !(it.product + " " + it.categorie).toLowerCase().includes(q))
            return false;
          return true;
        });
      }
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function render() {
        const rows = visible(),
          list = document.getElementById("list");
        if (!rows.length) {
          list.innerHTML =
            '<p class="empty">Niets gevonden. Probeer een andere zoekterm.</p>';
        } else {
          let html = "",
            last = "";
          for (const it of rows) {
            if (it.categorie !== last) {
              html += `<h2 class="cat" id="${esc(it.categorie.toLowerCase())}">${esc(it.categorie)}</h2>`;
              last = it.categorie;
            }
            const out = isOut(it),
              p = priceFor(it, mode);
            const season = (it.status || "").toLowerCase() === "seizoen";
            let priceHTML;
            if (out)
              priceHTML = '<span class="pill pill-out">Uitverkocht</span>';
            else if (isDay(it))
              priceHTML = '<span class="pill pill-day">Dagprijs</span>';
            else
              priceHTML = `${euro(p)}<small>${mode === "b2b" ? "ex. BTW" : "incl. BTW"}</small>`;
            const k = key(it),
              n = basket[k]?.n || 0;
            html += `<div class="item${out ? " out" : ""}">
        <div><span class="name">${esc(it.product)}</span>
          ${season ? '<span class="pill pill-season">Seizoen</span>' : ""}
          <div class="unit">${esc(it.eenheid)}</div></div>
        <div class="price">${priceHTML}</div>
        <div>${
          out
            ? ""
            : n
              ? `<div class="qty"><button data-k="${esc(k)}" data-d="-1" aria-label="Minder ${esc(it.product)}">−</button>
             <span>${n}</span>
             <button data-k="${esc(k)}" data-d="1" aria-label="Meer ${esc(it.product)}">+</button></div>`
              : `<button class="add" data-k="${esc(k)}" data-d="1" aria-label="Voeg ${esc(it.product)} toe">+</button>`
        }</div>
      </div>`;
          }
          list.innerHTML = html;
        }
        renderBar();
      }

      function renderBar() {
        const lines = Object.values(basket).filter((b) => b.n > 0);
        const bar = document.getElementById("bar");
        bar.hidden = lines.length === 0;
        document.body.classList.toggle("has-order", lines.length > 0);
        if (!lines.length) return;
        const total = lines.reduce((s, b) => s + b.n, 0);
        document.getElementById("count").textContent =
          `${total} ${total === 1 ? "artikel" : "artikelen"} in je lijst`;
        document.getElementById("wa").href =
          `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waMessage())}`;
      }

      function renderChips() {
        const cats = [...new Set(items.map((i) => i.categorie))];
        document.getElementById("chips").innerHTML = [
          ["", "Alles"],
          ...cats.map((c) => [c, c]),
        ]
          .map(
            ([v, l]) =>
              `<button data-c="${esc(v)}" aria-pressed="${v === cat}">${esc(l)}</button>`,
          )
          .join("");
        // called three ways: layout is not always settled on the first frame
        updateChipHint();
        requestAnimationFrame(updateChipHint);
        setTimeout(updateChipHint, 60);
      }

      function updateChipHint() {
        const w = document.getElementById("chipsWrap"),
          c = document.getElementById("chips"),
          h = null;
        if (!w || !c) return;
        const more = c.scrollWidth - c.clientWidth - c.scrollLeft > 8;
        w.setAttribute("data-more", String(more));
      }
      document
        .getElementById("chips")
        .addEventListener("scroll", updateChipHint, { passive: true });
      addEventListener("resize", updateChipHint);
      addEventListener("load", updateChipHint);
      if (window.ResizeObserver)
        new ResizeObserver(updateChipHint).observe(
          document.getElementById("chips"),
        );

      function renderTerms() {
        document.getElementById("terms").innerHTML =
          mode === "b2b"
            ? `<strong>Zakelijke levering.</strong> Alle prijzen zijn <strong>exclusief BTW</strong>.
       Wij bezorgen gratis tot in uw keuken. Voor 22:00 besteld = volgende ochtend
       geleverd, nalevering mogelijk tot 15:00. Dit is ons basisassortiment — in
       overleg stellen wij een persoonlijke assortimentslijst samen.`
            : `<strong>Particuliere levering.</strong> Alle prijzen zijn <strong>inclusief BTW</strong>.
       Geen minimum bestelling. Voor 22:00 besteld = volgende ochtend geleverd.
       Vragen? Bel of app <a href="tel:+31683415676">06 83 41 56 76</a>.`;
      }

      function setMode(m) {
        mode = m;
        localStorage.setItem("sa-mode", m);
        document
          .getElementById("m-b2b")
          .setAttribute("aria-pressed", String(m === "b2b"));
        document
          .getElementById("m-b2c")
          .setAttribute("aria-pressed", String(m === "b2c"));
        render();
        renderTerms();
      }

      // ---- events -----------------------------------------------------------
      document.getElementById("list").addEventListener("click", (e) => {
        const b = e.target.closest("[data-k]");
        if (!b) return;
        const it = items.find((i) => key(i) === b.dataset.k);
        if (!it) return;
        if (addToBasket(it, +b.dataset.d)) render();
      });
      document.getElementById("clear").onclick = () => {
        basket = {};
        save();
        render();
      };
      document.getElementById("q").addEventListener("input", (e) => {
        query = e.target.value;
        render();
      });
      document.getElementById("m-b2b").onclick = () => setMode("b2b");
      document.getElementById("m-b2c").onclick = () => setMode("b2c");
      document.getElementById("chips").addEventListener("click", (e) => {
        const b = e.target.closest("[data-c]");
        if (!b) return;
        cat = b.dataset.c;
        catSet = [];
        renderChips();
        render();
      });

      // ---- load -------------------------------------------------------------
      async function load() {
        const url = SHEET_CSV_URL || FALLBACK_CSV_URL;
        const meta = document.getElementById("meta");
        const cached = (() => {
          try {
            const c = JSON.parse(sessionStorage.getItem("sa-csv") || "null");
            return c && Date.now() - c.t < CACHE_MS ? c.text : null;
          } catch {
            return null;
          }
        })();

        let text = cached;
        if (!text) {
          try {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            text = await res.text();
            try {
              sessionStorage.setItem(
                "sa-csv",
                JSON.stringify({ t: Date.now(), text }),
              );
            } catch {}
          } catch (err) {
            console.error(err);
            meta.textContent =
              "Prijslijst tijdelijk niet beschikbaar. Bel of app 06 83 41 56 76.";
          }
        }
        if (text) {
          items = parseCSV(text).filter((i) => i.product);
          const d = new Date().toLocaleDateString("nl-NL", {
            day: "numeric",
            month: "long",
            year: "numeric",
          });
          const shown = catSet.length ? visible().length : items.length;
          meta.textContent =
            (catSet.length
              ? `${shown} van ${items.length} producten · gefilterd`
              : `${items.length} producten`) +
            ` · prijzen bijgewerkt op ${d}` +
            (SHEET_CSV_URL
              ? ""
              : " · DEMO-DATA, nog niet gekoppeld aan het Sheet");
        }
        renderChips();
        setMode(mode);
      }

      document
        .getElementById("pdf")
        .addEventListener("click", () => window.print());

      // ---- selftest (open met #selftest) -------------------------------------
      function selftest() {
        const a = (c, m) => {
          if (!c) throw new Error("SELFTEST FAILED: " + m);
        };

        const r = parseCSV(
          "categorie,product,eenheid,prijs_ex,btw,status,b2c\n" +
            '"Groenten, vers","Kool ""grof""",Stuk,1.50,9,normaal,TRUE\n' +
            "# comment,,,,,,\n" +
            "Overig,Afwasmiddel,Fles,2.50,21,normaal,TRUE\n" +
            "Groenten,Asperges,Bos,,,dagprijs,TRUE\n" +
            "Uien,Spaanse ui,Baal 25 kg,13.95,,normaal,FALSE\n" +
            "Groenten,Boerenkool,Kilo,1.20,,uitverkocht,TRUE\n",
        );
        a(r.length === 5, "comment rows skipped");
        a(r[0].categorie === "Groenten, vers", "quoted comma");
        a(r[0].product === 'Kool "grof"', "escaped quote");

        a(priceFor(r[0], "b2b") === 1.5, "b2b shows ex BTW");
        a(priceFor(r[0], "b2c") === 1.64, "9% rounding 1.50 -> 1.64");
        a(priceFor(r[1], "b2c") === 3.03, "21% rounding 2.50 -> 3.03");
        a(
          priceFor(r[3], "b2c") === 15.21,
          "blank btw defaults to 9 (13.95 -> 15.21)",
        );
        a(priceFor(r[2], "b2b") === null, "blank price -> no number");
        a(isDay(r[2]), "blank price is a dagprijs");

        // b2c filtering hides wholesale packs
        items = r;
        mode = "b2c";
        cat = "";
        query = "";
        a(
          !visible().some((i) => i.product === "Spaanse ui"),
          "b2c hides b2c=FALSE rows",
        );
        mode = "b2b";
        a(
          visible().some((i) => i.product === "Spaanse ui"),
          "b2b shows wholesale rows",
        );

        // search is case-insensitive
        query = "KOOL";
        a(
          visible().length === 2,
          "case-insensitive search matches Kool and Boerenkool",
        );
        query = "";

        // uitverkocht cannot be added
        basket = {};
        a(isOut(r[4]), "row 4 is the uitverkocht fixture");
        a(addToBasket(r[4], 1) === false, "uitverkocht refuses to be added");
        a(Object.keys(basket).length === 0, "uitverkocht left no basket entry");

        // quantities round-trip through localStorage
        addToBasket(r[0], 2);
        a(
          JSON.parse(localStorage.getItem("sa-basket"))[key(r[0])].n === 2,
          "quantity persisted",
        );
        addToBasket(r[0], -1);
        a(basket[key(r[0])].n === 1, "stepper decrements");

        // whatsapp message body
        const msg = waMessage();
        a(
          msg.includes('- 1x Kool "grof" (Stuk)'),
          "message lists qty, product, unit",
        );
        a(
          msg.includes("Bezorgadres:") && msg.includes("Gewenste bezorgdag:"),
          "message has address lines",
        );

        basket = {};
        save();
        console.log("selftest OK — 20 checks passed");
      }
      if (location.hash === "#selftest") selftest();
      else load();
    </script>

    <script>
      (function () {
        var b = document.getElementById("menuBtn"),
          n = document.getElementById("mainnav");
        if (!b || !n) return;
        function set(open) {
          n.setAttribute("data-open", String(open));
          b.setAttribute("aria-expanded", String(open));
        }
        b.addEventListener("click", function (e) {
          e.stopPropagation(); // don't trip the outside-click handler
          set(n.getAttribute("data-open") !== "true");
        });
        // close on: a link, a click anywhere outside, Escape, or resizing up to desktop
        n.addEventListener("click", function (e) {
          if (e.target.closest("a")) set(false);
        });
        document.addEventListener("click", function (e) {
          if (n.getAttribute("data-open") !== "true") return;
          if (!n.contains(e.target) && !b.contains(e.target)) set(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && n.getAttribute("data-open") === "true") {
            set(false);
            b.focus();
          }
        });
        addEventListener("resize", function () {
          if (innerWidth >= 900) set(false);
        });
      })();
    </script>
